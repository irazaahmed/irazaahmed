name: Generate Streak Stats

on:
  schedule:
    - cron: "45 19 * * *" # daily at 00:45 PKT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate streak stats SVG
        run: python3 scripts/gen_streak_stats.py
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add streak-stats.svg
          git commit -m "Update streak-stats.svg - [Skip GitHub Action]" || echo "no changes"
          git push
