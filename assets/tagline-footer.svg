<svg width="800" height="60" viewBox="0 0 800 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shimmerFooter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E97A2C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFE3BE" stop-opacity="1"/>
      <stop offset="100%" stop-color="#E97A2C" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="textClipFooter">
      <text x="400" y="28" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-weight="bold" font-size="18">Combining Islam with cutting-edge AI</text>
    </clipPath>
    <style>
      .base { fill: #E97A2C; font-family: Verdana, Geneva, sans-serif; font-weight: bold; }
      .sub { fill: #A0A0A0; font-family: Verdana, Geneva, sans-serif; }
      .shimmer-rect { animation: sweep 3.2s linear infinite; }
      @keyframes sweep {
        0%   { transform: translateX(-220px); }
        100% { transform: translateX(800px); }
      }
    </style>
  </defs>

  <text x="400" y="28" text-anchor="middle" class="base" font-size="18">Combining Islam with cutting-edge AI</text>
  <g clip-path="url(#textClipFooter)">
    <rect class="shimmer-rect" x="0" y="0" width="220" height="60" fill="url(#shimmerFooter)"/>
  </g>

  <text x="400" y="48" text-anchor="middle" class="sub" font-size="12">Build. Automate. Empower. &#8212; Let's create something meaningful together.</text>
</svg>
